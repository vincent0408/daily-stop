name: Refresh feed

on:
  schedule:
    # Every 3 hours in UTC+8: 00:00, 03:00, 06:00 ... 21:00.
    # Cron is UTC, so that is 01:00, 04:00 ... 22:00 UTC.
    - cron: "0 1-22/3 * * *"
  workflow_dispatch:        # the page's Refresh button and GitHub's "Run workflow" use this
  push:
    branches: [main]        # redeploy when you change code or add a source

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
